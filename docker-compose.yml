services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-restaurant_billing}
      POSTGRES_USER: ${POSTGRES_USER:-billing_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-billing_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-billing_user} -d ${POSTGRES_DB:-restaurant_billing}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./restaurant-billing-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgres://${POSTGRES_USER:-billing_user}:${POSTGRES_PASSWORD:-billing_pass}@postgres:5432/${POSTGRES_DB:-restaurant_billing}
      # The bundled postgres service above doesn't have SSL enabled, so this
      # must stay false -- only set DB_SSL=true in .env if DATABASE_URL is
      # ever pointed at an external Postgres that terminates TLS itself.
      DB_SSL: ${DB_SSL:-false}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      # CORS origin -- must match the address browsers use to reach the
      # frontend, i.e. the shop server's LAN IP, not "localhost".
      FRONTEND_URL: http://${SERVER_LAN_IP}:3000
      # This install is plain HTTP on the shop's LAN (see SERVER_LAN_IP
      # above), so the login cookie can't be marked Secure -- browsers drop
      # Secure cookies outright over HTTP. Set COOKIE_SECURE=true in .env
      # only if this is ever put behind a reverse proxy terminating HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      UPLOAD_DIR: public/uploads
      BILL_NUMBER_PREFIX: ${BILL_NUMBER_PREFIX:-INV}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
      # A full DB backup runs automatically on startup and every 24h after
      # (see services/backupService.js) -- BACKUP_ENABLED=false to turn it
      # off, BACKUP_RETENTION_COUNT to keep more/fewer than the default 7.
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-7}
      # Optional networked kitchen ticket printer -- see "Kitchen ticket
      # printer" in the README. Disabled (no-op) unless explicitly turned on.
      KITCHEN_PRINTER_ENABLED: ${KITCHEN_PRINTER_ENABLED:-false}
      KITCHEN_PRINTER_IP: ${KITCHEN_PRINTER_IP:-}
      KITCHEN_PRINTER_PORT: ${KITCHEN_PRINTER_PORT:-9100}
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/public/uploads
      - ./restaurant-billing-backend/logs:/app/logs
      - ./restaurant-billing-backend/backups:/app/backups

  frontend:
    build:
      context: ./restaurant-billing-frontend
      args:
        # Baked into the JS bundle at build time -- see the Dockerfile
        # comment. Changing SERVER_LAN_IP later requires
        # `docker compose up -d --build frontend` to take effect.
        NEXT_PUBLIC_API_BASE_URL: http://${SERVER_LAN_IP}:5000/api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata:
  backend_uploads:
